<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><title>WebApp bridge security boundary</title><desc>A browser connection crosses a trust boundary through a deliberately small protocol.</desc><style>.bg{fill:#0b1020}.b{fill:#121a2d;stroke:#7dd3fc;stroke-width:2}.c{fill:#172554;stroke:#a5b4fc;stroke-width:2}.a{fill:#132e2a;stroke:#5eead4;stroke-width:2}.w{fill:#2b2110;stroke:#fbbf24;stroke-width:2}.t{fill:#f8fafc;font:600 24px system-ui}.s{fill:#cbd5e1;font:400 18px system-ui}.h{fill:#7dd3fc;font:700 30px system-ui}.ar{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1200" height="680"/><text class="h" x="60" y="65">The bridge is a gate, not a tunnel into the desktop</text><rect class="b" x="70" y="140" width="250" height="180"/><text class="t" x="135" y="185">Browser</text><text class="s" x="105" y="225">origin</text><text class="s" x="105" y="253">launch intent</text><text class="s" x="105" y="281">bounded events</text><path class="ar" d="M320 230H430"/><rect class="w" x="430" y="115" width="340" height="230"/><text class="t" x="510" y="160">Trust boundary</text><text class="s" x="475" y="200">origin validation</text><text class="s" x="475" y="228">short-lived token</text><text class="s" x="475" y="256">protocol + schema</text><text class="s" x="475" y="284">size / rate limits</text><text class="s" x="475" y="312">artifact identity</text><path class="ar" d="M770 230H880"/><rect class="a" x="880" y="140" width="250" height="180"/><text class="t" x="945" y="185">AnyApp</text><text class="s" x="915" y="225">validate</text><text class="s" x="915" y="253">resolve</text><text class="s" x="915" y="281">execute locally</text><rect class="c" x="190" y="410" width="820" height="120"/><text class="t" x="405" y="455">Explicitly forbidden</text><text class="s" x="285" y="495">arbitrary commands • files • assemblies • ambient desktop authority</text><text class="s" x="355" y="600">Every crossing has a contract and a failure mode.</text></svg>