name: Build

on:
  push:
    branches:
      - master
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-package-build:
    # Development is validated against the current sibling-source graph below.
    # Keep public NuGet compatibility checks on master and PRs targeting master.
    if: ${{ github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.base_ref == 'master') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.WebApp.sln

      - name: Build
        run: dotnet build TheSingularityWorkshop.WebApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/TheSingularityWorkshop.WebApp.Tests/TheSingularityWorkshop.WebApp.Tests.csproj --configuration Release --no-build --verbosity normal

  source-integration:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout WebApp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: WebApp

      - name: Checkout FSM_API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/FSM_API
          ref: development
          path: FSM_API

      - name: Checkout FSM_UserIO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/FSM_UserIO
          ref: development
          path: FSM_UserIO

      - name: Checkout MicroBundleDomain source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: TheSingularityWorkshop.MicroBundleDomain

      - name: Checkout FSM_COS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: development
          path: TheSingularityWorkshop.FSM_COS

      - name: Checkout GUI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: TheSingularityWorkshop.GUI

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore source graph
        working-directory: WebApp
        run: dotnet restore TheSingularityWorkshop.WebApp.sln -p:WorkshopUseRepositorySources=true

      - name: Build source graph
        working-directory: WebApp
        run: dotnet build TheSingularityWorkshop.WebApp.sln --configuration Release --no-restore -p:WorkshopUseRepositorySources=true
      - name: Test source graph
        working-directory: WebApp
        run: dotnet test tests/TheSingularityWorkshop.WebApp.Tests/TheSingularityWorkshop.WebApp.Tests.csproj --configuration Release -p:WorkshopUseRepositorySources=true
